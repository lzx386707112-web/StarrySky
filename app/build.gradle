plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.lzx.musiclib'
    compileSdk 34

    defaultConfig {
        applicationId "com.lzx.musiclib"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-opt-in=androidx.media3.common.util.UnstableApi"]
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'

    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0"

    implementation project(':starrysky')

    def m3 = rootProject.ext.media3_version
    implementation "androidx.media3:media3-exoplayer-hls:$m3"
    implementation "androidx.media3:media3-datasource-rtmp:$m3"
    implementation "androidx.media3:media3-exoplayer-dash:$m3"
    implementation "androidx.media3:media3-exoplayer-smoothstreaming:$m3"

    implementation 'com.qw:soulpermission:1.3.0'
    implementation 'com.danikula:videocache:2.7.1'
    implementation 'com.bigkoo:convenientbanner:2.1.5'
    implementation 'com.mikhaellopez:circularimageview:4.2.0'
    implementation 'com.noober.background:core:1.6.5'
    implementation 'com.afollestad.material-dialogs:core:3.3.0'
    implementation 'com.afollestad.material-dialogs:bottomsheets:3.3.0'

    implementation 'com.tencent.bugly:crashreport:3.1.0'
    implementation 'com.tencent.bugly:nativecrashreport:3.7.1'

    implementation "com.github.ssseasonnn.RxDownload:rxdownload4:1.0.9"
    implementation 'com.github.Lundez:Croller:1.0.3'
}
